name: Pull Request Labeler & Template Manager

on:
  pull_request_target:
    types: [opened, reopened, synchronized]
    branches:
      - prod
      - stage

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  labeler:
    name: Auto Label & Template PR
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'release-please--') && github.event.pull_request.user.login != 'github-actions[bot]' }}
    steps:
      - name: Checkout Base Branch Code (Trusted)
        uses: actions/checkout@v7

      - name: Extract Version from PR securely
        if: github.event.pull_request.base.ref == 'prod'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          VERSION=$(gh api repos/${{ github.repository }}/contents/package.json?ref=$PR_HEAD_SHA --jq '.content' | base64 --decode | jq -r '.version')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Update PR Properties
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          # Create labels if they do not exist
          gh label create "release-candidate" --color "d4c5f9" --description "Release Candidate Promotion PR" || true
          gh label create "stage-pr" --color "bfd4f2" --description "Staging Pull Request" || true

          # Fetch current PR body to see if it is empty or matches default template warning
          CURRENT_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body')
          
          # Check if the body is empty (ignoring whitespace) or contains the default instructions/warning
          if [ -z "$(echo "$CURRENT_BODY" | tr -d '[:space:]')" ] || echo "$CURRENT_BODY" | grep -q "READ THIS BEFORE CREATING YOUR PULL REQUEST"; then
            SHOULD_TEMPLATIZE=true
          else
            SHOULD_TEMPLATIZE=false
          fi

          if [ "$TARGET_BRANCH" = "prod" ]; then
            # Add label
            gh pr edit "$PR_NUMBER" --add-label "release-candidate"
            
            # Update Title with version
            gh pr edit "$PR_NUMBER" --title "orca-release: Promote Release Candidate from v${{ env.VERSION }}"
            
            # Update Body with Release Candidate template if not already customized
            if [ "$SHOULD_TEMPLATIZE" = "true" ]; then
              gh pr edit "$PR_NUMBER" --body "$(cat .github/PULL_REQUEST_TEMPLATE/release_candidate.md)"
            fi
          elif [ "$TARGET_BRANCH" = "stage" ]; then
            # Add label
            gh pr edit "$PR_NUMBER" --add-label "stage-pr"
            
            # Update Body with Basic template if not already customized
            if [ "$SHOULD_TEMPLATIZE" = "true" ]; then
              gh pr edit "$PR_NUMBER" --body "$(cat .github/PULL_REQUEST_TEMPLATE/basic.md)"
            fi
          fi
