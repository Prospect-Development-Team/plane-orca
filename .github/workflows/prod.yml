# =============================================================================
# Prod: Build & Deploy (Plane Orca Production)
# =============================================================================
#
# When: You push to the "prod" branch with a release commit or trigger manually.
# Where: Runs on GitHub Actions runners (ubuntu-latest).
#
# What happens:
#   • Build & Push: Builds the web, api, space, admin, live, and proxy images
#     directly from the verified release commit on "prod" and pushes to GHCR
#     tagged as :latest and :v[Version] / :[Version].
#   • Release Notes: Appends official container artifact tags and pull commands
#     to the GitHub Release created by release-please.
#   • Deploy: Triggers Coolify production deployment, polls state until completion,
#     and outputs step summaries or issues cancellations.
#   • Sync Stage: Merges the prod release commit back to stage to ensure branches
#     remain aligned.
#
# What you need in GitHub Secrets:
#   • COOLIFY_DEPLOY_URL - Full production deploy URL with uuid parameter.
#   • COOLIFY_API_TOKEN  - Authorization bearer token for your Coolify API.
#
# Environment Configuration:
#   • Targets the GitHub Environment named "prod" to resolve secrets.
#
# =============================================================================

name: Production CI/CD

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: prod-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write
  issues: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Release Please (Evaluates Conventional Commits & Creates Releases/PRs)
  # ---------------------------------------------------------------------------
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
      pr: ${{ steps.release.outputs.pr }}
      version: ${{ steps.vars.outputs.version }}
      clean_version: ${{ steps.vars.outputs.clean_version }}
      image_name: ${{ steps.vars.outputs.image_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          target-branch: prod

      - name: Assign User to Generated Release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_JSON: ${{ steps.release.outputs.pr }}
          RELEASE_ASSIGNEE_VAR: ${{ vars.RELEASE_ASSIGNEE }}
          ACTOR: ${{ github.actor }}
        run: |
          PR_NUMBER=$(echo "$RELEASE_PR_JSON" | python3 -c "import sys, json; print(json.load(sys.stdin).get('number',''))" 2>/dev/null || true)
          TARGET_ASSIGNEE="${RELEASE_ASSIGNEE_VAR:-$ACTOR}"
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            echo "Release PR #$PR_NUMBER generated by release-please. Assigning $TARGET_ASSIGNEE..."
            gh pr edit "$PR_NUMBER" --add-assignee "$TARGET_ASSIGNEE" || true
          fi

      - name: Extract Release Version & Image Name
        id: vars
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CLEAN_VER="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "clean_version=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "image_name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # 2. Build & Push Production Images (Directly from Release Commit)
  # ---------------------------------------------------------------------------
  build-push:
    name: Build & Push ${{ matrix.service }}
    needs: [release-please]
    if: (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') && success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            context: .
            file: ./apps/web/Dockerfile.web
          - service: api
            context: ./apps/api
            file: ./apps/api/Dockerfile.api
          - service: space
            context: .
            file: ./apps/space/Dockerfile.space
          - service: admin
            context: .
            file: ./apps/admin/Dockerfile.admin
          - service: live
            context: .
            file: ./apps/live/Dockerfile.live
          - service: proxy
            context: ./apps/proxy
            file: ./apps/proxy/Dockerfile.ce
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Pre-build Runner Hygiene Cleanup
        run: |
          echo "Running pre-build Docker cleanup..."
          docker container prune -f
          docker image prune -a -f --filter "until=24h"
          docker builder prune -a -f --filter "until=24h"

      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.release-please.outputs.image_name }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ needs.release-please.outputs.image_name }}/${{ matrix.service }}:${{ needs.release-please.outputs.clean_version }}
            ${{ env.REGISTRY }}/${{ needs.release-please.outputs.image_name }}/${{ matrix.service }}:v${{ needs.release-please.outputs.clean_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Post-build Runner Hygiene Cleanup
        if: always()
        run: |
          echo "Running post-build Docker cleanup..."
          docker container prune -f
          docker image prune -f
          docker builder prune -f

  release-notes:
    name: Update GitHub Release Notes
    needs: [release-please, build-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Update GitHub Releases with Official Container Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLEAN_VER="${{ needs.release-please.outputs.clean_version }}"
          TAG="v${CLEAN_VER}"
          IMAGE_BASE="${{ env.REGISTRY }}/${{ needs.release-please.outputs.image_name }}"

          EXISTING_NOTES=$(gh release view "$TAG" --json body --jq '.body' 2>/dev/null || true)
          if [ -n "$EXISTING_NOTES" ] && [[ "$EXISTING_NOTES" != *"Production Container Artifacts"* ]]; then
            HEADER=$(printf "### 🐳 Production Container Artifacts\n- **Web App**: \`%s/web:v%s\`\n- **Admin Panel**: \`%s/admin:v%s\`\n- **API Backend**: \`%s/api:v%s\`\n- **Space**: \`%s/space:v%s\`\n- **Live WebSockets**: \`%s/live:v%s\`\n- **Proxy Gateway**: \`%s/proxy:v%s\`\n- **Pull Commands**:\n\`\`\`bash\ndocker pull %s/web:v%s\ndocker pull %s/admin:v%s\ndocker pull %s/api:v%s\ndocker pull %s/space:v%s\ndocker pull %s/live:v%s\ndocker pull %s/proxy:v%s\n\`\`\`" "$IMAGE_BASE" "$CLEAN_VER" "$IMAGE_BASE" "$CLEAN_VER" "$IMAGE_BASE" "$CLEAN_VER" "$IMAGE_BASE" "$CLEAN_VER" "$IMAGE_BASE" "$CLEAN_VER" "$IMAGE_BASE" "$CLEAN_VER" "$IMAGE_BASE" "$CLEAN_VER" "$IMAGE_BASE" "$CLEAN_VER" "$IMAGE_BASE" "$CLEAN_VER" "$IMAGE_BASE" "$CLEAN_VER" "$IMAGE_BASE" "$CLEAN_VER" "$IMAGE_BASE" "$CLEAN_VER")
            COMBINED_NOTES="${HEADER}"$'\n\n---\n\n'"${EXISTING_NOTES}"
            gh release edit "$TAG" --notes "$COMBINED_NOTES" || true
          fi

  deploy:
    name: Deploy to Production (Coolify)
    needs: [release-please, build-push]
    if: (needs.build-push.result == 'success') && success()
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Trigger Coolify deploy
        id: deploy
        run: |
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          if [ -z "$deploy_url" ]; then
            echo "::error::COOLIFY_DEPLOY_URL is empty."
            exit 1
          fi
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          uuid="${deploy_url#*uuid=}"
          uuid="${uuid%%&*}"
          success=0
          for i in 1 2 3; do
            if resp=$(curl -f -sS --max-time 30 -X POST "${base}/deploy" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"uuid\": \"${uuid}\"}"); then
              success=1
              echo "$resp" > deploy_response.json
              break
            fi
            [ $i -lt 3 ] && sleep 10
          done
          [ "$success" -eq 1 ] || exit 1

      - name: Wait for deployment
        id: wait
        if: success()
        run: |
          dep_uuid=$(python3 -c "
          import json
          try:
              d=json.load(open('deploy_response.json'))
              print(d.get('deployments', [{}])[0].get('deployment_uuid',''))
          except Exception:
              pass
          " 2>/dev/null || true)
          if [ -z "$dep_uuid" ]; then
            echo "::error::Could not read deployment UUID."
            exit 1
          fi
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          token="${{ secrets.COOLIFY_API_TOKEN }}"
          timeout_sec=900
          interval=20
          elapsed=0
          while [ $elapsed -lt $timeout_sec ]; do
            curl -sS --max-time 30 -X GET "${base}/deployments/${dep_uuid}" \
              -H "Authorization: Bearer ${token}" -o deployment.json 2>/dev/null || true
            status=$(python3 -c "
          import json
          try:
              print(json.load(open('deployment.json')).get('status','').lower())
          except Exception:
              print('')
          " 2>/dev/null || true)
            case "$status" in
              finished|success) break ;;
              failed|cancelled|cancelled-by-user) echo "Coolify deployment failed or was cancelled: $status"; exit 1 ;;
              *) ;;
            esac
            sleep $interval
            elapsed=$((elapsed + interval))
          done
          if [ $elapsed -ge $timeout_sec ]; then
            echo "Deployment did not finish within ${timeout_sec}s"
            exit 1
          fi
          echo "elapsed_sec=$elapsed" >> "$GITHUB_OUTPUT"

      - name: Write deployment summary
        if: success() && steps.wait.outcome == 'success'
        env:
          ELAPSED_SEC: ${{ steps.wait.outputs.elapsed_sec }}
        run: |
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          dashboard="${base%/api/v1}"
          [ "$dashboard" = "$base" ] && dashboard="${base%/api}"
          export DASHBOARD="$dashboard"
          export GITHUB_SERVER_URL="${{ github.server_url }}"
          export GITHUB_REPOSITORY="${{ github.repository }}"
          export GITHUB_SHA="${{ github.sha }}"
          export GITHUB_REF_NAME="${{ github.ref_name }}"
          export ELAPSED_SEC="${ELAPSED_SEC:-0}"
          python3 << 'PY'
          import json, os
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY', '')
          dashboard = (os.environ.get('DASHBOARD') or '').rstrip('/')
          gh_server = os.environ.get('GITHUB_SERVER_URL', '')
          gh_repo = os.environ.get('GITHUB_REPOSITORY', '')
          gh_sha = os.environ.get('GITHUB_SHA', '')
          branch = os.environ.get('GITHUB_REF_NAME', '—')
          try:
              elapsed_sec = int(os.environ.get('ELAPSED_SEC', 0))
          except Exception:
              elapsed_sec = 0
          def format_duration(s):
              if s < 60:
                  return f'{s}s'
              m, s = divmod(s, 60)
              return f'{m}m {s}s' if s else f'{m}m'
          deploy_duration = format_duration(elapsed_sec) if elapsed_sec else '—'
          try:
              with open('deployment.json') as f:
                  d = json.load(f)
          except Exception:
              d = {}
          app = d.get('application_name', 'N/A')
          status = (d.get('status') or 'N/A').lower()
          status_display = '✅ ' + status if status in ('finished', 'success') else status
          coolify_path = (d.get('deployment_url') or '').strip()
          if coolify_path and dashboard and not (coolify_path.startswith('http://') or coolify_path.startswith('https://')):
              full_coolify_url = dashboard + coolify_path if coolify_path.startswith('/') else coolify_path
          else:
              full_coolify_url = dashboard if dashboard else ''
          coolify_url_cell = f'[Link]({full_coolify_url})' if full_coolify_url else '—'
          commit = d.get('commit') or d.get('commit_message') or gh_sha or '—'
          commit_sha = (d.get('commit') or gh_sha or '').strip()
          if commit_sha and gh_server and gh_repo:
              short_sha = commit_sha[:7] if len(commit_sha) >= 7 else commit_sha
              commit_cell = f'[{short_sha}]({gh_server}/{gh_repo}/commit/{commit_sha})'
          else:
              commit_cell = commit
          lines = [
              '## Coolify deployment',
              '',
              '| Property | Value |',
              '|---|-----|',
              f'| **Application** | {app} |',
              f'| **Status** | {status_display} |',
              f'| **Branch** | {branch} |',
              f'| **Deploy duration** | {deploy_duration} |',
              f'| **Commit** | {commit_cell} |',
              f'| **Coolify URL** | {coolify_url_cell} |',
              '',
          ]
          if summary_path:
              with open(summary_path, 'a') as f:
                  f.write('\n'.join(lines) + '\n')
          PY

      - name: Cancel Coolify deployment (if job cancelled)
        if: cancelled()
        run: |
          dep_uuid=$(python3 -c "
          import json
          try:
              d=json.load(open('deploy_response.json'))
              print(d.get('deployments', [{}])[0].get('deployment_uuid',''))
          except Exception:
              pass
          " 2>/dev/null || true)
          if [ -z "$dep_uuid" ]; then exit 0; fi
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          curl -sS --max-time 15 -X POST "${base}/deployments/${dep_uuid}/cancel" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" || true

      - name: Deployment failed summary
        if: failure()
        run: |
          branch="${{ github.ref_name }}"
          sha="${{ github.sha }}"
          short_sha="${sha:0:7}"
          repo="${{ github.repository }}"
          server="${{ github.server_url }}"
          commit_link="[${short_sha}](${server}/${repo}/commit/${sha})"
          {
            echo '## Deployment failed'
            echo ''
            echo 'Deployment failed, was cancelled, or timed out.'
            echo ''
            echo '| | |'
            echo '|---|-----|'
            echo "| **Branch** | ${branch} |"
            echo "| **Commit** | ${commit_link} |"
          } >> "$GITHUB_STEP_SUMMARY"

  sync-stage:
    name: Sync Prod to Stage
    needs: [release-please, deploy]
    if: (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') && success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: stage
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge prod branch into stage
        run: |
          git fetch origin prod:prod || true
          COMMIT_MSG="orca-chore: sync prod back to stage [skip ci]"

          if git merge prod --ff-only; then
            echo "Fast-forwarded stage to prod cleanly (0 merge commits)."
          else
            echo "Stage has local commits ahead of prod. Performing standard merge..."
            git merge prod -m "$COMMIT_MSG" --no-ff
          fi

          git push origin stage
