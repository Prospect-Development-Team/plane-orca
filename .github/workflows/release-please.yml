name: Release Please

on:
  push:
    branches:
      - prod

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        with:
          release-type: node
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          target-branch: prod
